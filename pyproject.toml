[project]
name = "volco"
version = "0.1.0"
description = ""
authors = [{ name = "Ondrej Zacha", email = "zachaondrej@gmail.com" }]
requires-python = ">=3.10, <3.12"
dependencies = [
    "fastapi>=0.100.0",
    "socketIO-client>=0.7.2,<0.8",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.5,<0.0.6",
    "Jinja2>=3.1.2,<4",
    "requests==2.31.0",
    "pygments==2.15.0",
    "mypy>=1.16.1",
    "uvicorn>=0.35.0",
    "httpx>=0.28.1",
    "fastmcp>=2.2.6",
]

[project.scripts]
refresh = "volco.updater:main"

[dependency-groups]
dev = [
    "ruff>=0.12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules
select = [
    "E",  # pycodestyle, generic rules
    "F",  # Pyflakes, generic rules
    "B",  # bugbear - best practices
    "I",  # isort
    "RUF100",  # unused noqa 
    "ARG",  # unused arguments
    # "T20",  # no print() statements
    "UP",  # upgrade to latest Python features
    "W505",  # comment/docstring line length
]
ignore = [
    "E501",  # line length handled by ruff format
]
